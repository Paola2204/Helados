<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heladería Paola - Sistema Profesional</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fff5f7; 
            margin: 0; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        @keyframes pulse-logo {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes zoom-out-portal {
            0% { transform: scale(1); opacity: 1; filter: blur(0px); }
            100% { transform: scale(15); opacity: 0; filter: blur(15px); }
        }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes jelly { 0% { transform: scale(1, 1); } 30% { transform: scale(1.1, 0.9); } 100% { transform: scale(1, 1); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulse-attention { 0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); } }
        
        .animate-pulse-logo { animation: pulse-logo 1.2s ease-in-out infinite; }
        .animate-zoom-portal { animation: zoom-out-portal 0.7s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-jelly:active { animation: jelly 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .animate-fade-up { animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .animate-pulse-attention { animation: pulse-attention 2s infinite; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #fff1f2; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fb7185; border-radius: 20px; }
        
        .product-card-img { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .group:hover .product-card-img { transform: scale(1.15) rotate(2deg); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">

        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, setDoc, query, orderBy, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4kNnBH0_3zpub9ZRyv7yyRIOpN6GhtE4",
            authDomain: "heladeria-paola.firebaseapp.com",
            projectId: "heladeria-paola",
            storageBucket: "heladeria-paola.firebasestorage.app",
            messagingSenderId: "791268520785",
            appId: "1:791268520785:web:22bb0bc99a61f426825970",
            measurementId: "G-3C20H0BDGT"

        const app = initializeApp(firebaseConfig);
        window.fb = {

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        
        const LOGO_URL = "http://lemustech.net/paola/Logo%20Sal%C3%B3n%20de%20Fiestas%20Infantil%20Colorido%20Morado%20%281%29.png";
        const EXCHANGE_RATE = 400;
        const APP_ID = 'heladeria-paola-v1';

        const formatMoney = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        const formatBs = (amount) => new Intl.NumberFormat('es-VE', { style: 'decimal', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amount * EXCHANGE_RATE) + ' Bs';

        const icons = {
            LayoutDashboard: "M3 3h7v7H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 14h7v5H3z",
            ShoppingCart: "M8 21h12a2 2 0 0 0 2-1.6l1-8.5a2 2 0 0 0-2-2.3H5.2 M2 3h2l.9 5 M16 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2 M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2",
            PieChart: "M21.21 15.89A10 10 0 1 1 8 2.83 M22 12A10 10 0 0 0 12 2v10z",
            IceCream2: "M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5C17.8 6.2 16 3 12 3S6.2 6.2 6 9.5c-2 1.6-3 3.5-3 5.5a7 7 0 0 0 7 7z",
            ClipboardList: "M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2 M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z M12 11h4 M12 16h4 M8 11h.01 M8 16h.01",
            TrendingDown: "m22 17-8.5-8.5-5 5L2 7",
            TrendingUp: "m22 7-8.5 8.5-5-5L2 17",
            History: "M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12",
            Settings: "M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
            Store: "m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7 M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8 M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4 M2 7h20 M2 7l1.5 6a2 2 0 0 0 2 1.5h13a2 2 0 0 0 2-1.5L22 7",
            X: "M18 6 6 18 M6 6l12 12",
            LockIcon: "M19 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2Z M7 11V7a5 5 0 0 1 10 0v4",
            Star: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
            ShoppingBag: "M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z M3 6h18 M16 10a4 4 0 0 1-8 0",
            Smartphone: "M12 2a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V5a3 3 0 0 0-3-3H9z M12 18h.01",
            Trash2: "M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2",
            Plus: "M5 12h14 M12 5v14",
            RotateCcw: "M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12 M3 3v9h9",
            AlertTriangle: "M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01",
            Instagram: "M12 2c2.717 0 3.056.01 4.122.06 1.065.05 1.79.217 2.428.465.66.254 1.216.598 1.772 1.153a4.908 4.908 0 0 1 1.153 1.772c.247.637.415 1.363.465 2.428.047 1.066.06 1.405.06 4.122 0 2.717-.01 3.056-.06 4.122-.05 1.065-.217 1.79-.465 2.428a4.883 4.883 0 0 1-1.153 1.772 4.915 4.915 0 0 1-1.772 1.153c-.637.247-1.363.415-2.428.465-1.066.047-1.405.06-4.122.06-2.717 0-3.056-.01-4.122-.06-1.065-.05-1.79-.217-2.428-.465a4.92 4.92 0 0 1-1.772-1.153 4.904 4.904 0 0 1-1.153-1.772c-.247-.637-.415-1.363-.465-2.428C2.013 15.056 2 14.717 2 12c0-2.717.01-3.056.06-4.122.05-1.065.217-1.79.465-2.428a4.88 4.88 0 0 1 1.153-1.772A4.897 4.897 0 0 1 5.45 2.525c.638-.248 1.362-.415 2.428-.465C8.944 2.013 9.283 2 12 2zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm6.5-.25a1.25 1.25 0 0 0-2.5 0 1.25 1.25 0 0 0 2.5 0zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z",
            Send: "M22 2 11 13 M22 2l-7 20-4-9-9-4 20-7z",
            ArrowLeft: "M19 12H5 M12 19l-7-7 7-7",
            Menu: "M4 6h16 M4 12h16 M4 18h16",
            Package: "m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"
        };

        function LucideIcon({ name, size = 20, className = "" }) {
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide ${className}`}>
                    <path d={icons[name] || ""} />
                </svg>
            );
        }

        function Card({ children, className = "" }) {
            return <div className={`bg-white rounded-3xl shadow-sm border border-pink-50 p-6 transition-all duration-300 ${className}`}>{children}</div>;
        }

        function Button({ children, onClick, variant = "primary", className = "", disabled = false }) {
            const base = "px-4 py-3 rounded-2xl font-bold transition-all duration-300 flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed animate-jelly";
            const variants = {
                primary: "bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-lg shadow-pink-200",
                secondary: "bg-white border-2 border-pink-100 text-pink-600 hover:bg-pink-50",
                danger: "bg-red-50 text-red-500 border border-red-100",
                success: "bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-lg shadow-emerald-200",
                dark: "bg-gray-900 text-white"
            };
            return <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>{children}</button>;
        }

        function Input({ label, value, onChange, type = "text", placeholder }) {
            return (
                <div className="flex flex-col gap-1.5 w-full text-left">
                    {label && <label className="text-sm font-semibold text-gray-700">{label}</label>}
                    <input type={type} value={value} onChange={onChange} placeholder={placeholder} className="w-full px-5 py-3.5 rounded-2xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-pink-500 focus:ring-4 focus:ring-pink-100 outline-none transition-all duration-300" />
                </div>
            );
        }

        function Footer({ className = "" }) {
            return (
                <footer className={`py-6 text-center ${className}`}>
                    <a href="https://www.instagram.com/lemustech.ve/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-xs font-medium text-gray-400 hover:text-pink-500 transition-colors duration-300 bg-white/50 px-4 py-2 rounded-full backdrop-blur-sm shadow-sm border border-transparent hover:border-pink-100">
                        <span>Website creada por</span><span className="font-bold flex items-center gap-1">@Lemustech.ve <LucideIcon name="Instagram" size={12} /></span>
                    </a>
                </footer>
            );
        }

        function DashHome({ products, transactions }) {
            const today = new Date().toDateString();
            const todayTx = transactions.filter(t => new Date(t.date).toDateString() === today);
            const sales = todayTx.reduce((acc, t) => acc + (t.type === 'sale' ? t.total : 0), 0);
            const lowStock = products.filter(p => p.stock < 5);
            return (
                <div className="space-y-8 animate-fade-up">
                    <h2 className="text-3xl font-black text-gray-900">Resumen</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <Card className="bg-gradient-to-br from-green-400 to-emerald-600 text-white border-none shadow-xl"><div className="flex justify-between mb-4 opacity-80"><LucideIcon name="TrendingUp"/><span>Ventas Hoy</span></div><div className="text-4xl font-black">{formatMoney(sales)}</div><div className="text-sm opacity-90">{formatBs(sales)}</div></Card>
                        <Card className="bg-gradient-to-br from-blue-500 to-indigo-600 text-white border-none shadow-xl"><div className="flex justify-between mb-4 opacity-80"><LucideIcon name="Package"/><span>Stock Crítico</span></div><div className="text-4xl font-black">{lowStock.length}</div><div className="text-sm opacity-90">Variedades</div></Card>
                        <Card className="bg-gradient-to-br from-purple-500 to-pink-600 text-white border-none shadow-xl"><div className="flex justify-between mb-4 opacity-80"><LucideIcon name="History"/><span>Movimientos</span></div><div className="text-4xl font-black">{todayTx.length}</div><div className="text-sm opacity-90">Registros</div></Card>
                    </div>
                </div>
            );
        }

        function DashPOS({ products, onTx, onStock }) {
            const [cart, setCart] = useState([]);
            const total = cart.reduce((acc, i) => acc + (i.price * i.quantity), 0);
            const addToCart = (p) => {
                const ex = cart.find(i => i.id === p.id);
                if(p.stock <= (ex?.quantity || 0)) return alert("Sin existencias");
                if(ex) setCart(cart.map(i => i.id === p.id ? {...i, quantity: i.quantity + 1} : i));
                else setCart([...cart, {...p, quantity: 1}]);
            };
            return (
                <div className="flex flex-col lg:flex-row gap-8 h-full animate-fade-up">
                    <div className="flex-1 grid grid-cols-2 md:grid-cols-3 gap-4 overflow-y-auto custom-scrollbar">{products.map(p => (
                        <button key={p.id} disabled={p.stock<=0} onClick={()=>addToCart(p)} className={`p-4 rounded-3xl text-left border-2 flex flex-col justify-between h-40 transition-all ${p.stock>0?'bg-white border-transparent shadow-sm hover:border-pink-300':'bg-gray-100 opacity-60'}`}>
                            <div className="flex justify-between items-start"><span className="font-bold text-gray-700 text-sm">{p.name}</span><span className="text-xs bg-pink-50 text-pink-600 px-2 rounded-full">{p.stock}</span></div>
                            <div className="text-3xl mx-auto">{p.emoji}</div>
                            <span className="font-black text-pink-600">{formatMoney(p.price)}</span>
                        </button>
                    ))}</div>
                    <Card className="lg:w-96 flex flex-col shadow-2xl h-fit max-h-[80vh]">
                        <h3 className="font-bold text-xl mb-6">Punto de Venta</h3>
                        <div className="flex-1 overflow-y-auto space-y-2 mb-6 custom-scrollbar">{cart.map(i => <div key={i.id} className="flex justify-between text-sm p-3 bg-gray-50 rounded-xl"><span>{i.quantity}x {i.name}</span><span className="font-bold">{formatMoney(i.price*i.quantity)}</span></div>)}</div>
                        <div className="border-t border-dashed pt-4 mb-4"><div className="flex justify-between items-end text-right font-black"><span className="text-gray-500 font-normal">Total</span><div><p className="text-3xl text-gray-900">{formatMoney(total)}</p><p className="text-xs text-gray-400">{formatBs(total)}</p></div></div></div>
                        <Button onClick={() => { if(cart.length===0) return; onTx({type:'sale',total,description:cart.map(i=>`${i.quantity}x ${i.name}`).join(', ')}); cart.forEach(i=>onStock(i.id,-i.quantity)); setCart([]); alert("Cobrado"); }} disabled={cart.length===0} className="w-full py-4">COBRAR VENTA</Button>
                    </Card>
                </div>
            );
        }

        function DashProducts({ products, onAddProduct, onEditProduct, onDeleteProduct }) {
            const [isEditing, setIsEditing] = useState(false);
            const [form, setForm] = useState({ name: '', price: '', stock: '', emoji: '', image: '' });
            return (
                <div className="space-y-6 animate-fade-up text-left">
                    <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">Gestión de Sabores</h2><Button onClick={()=>{setForm({ name:'', price:'', stock:'', emoji:'', image:'' });setIsEditing(true)}} variant="success"><LucideIcon name="Plus"/> Nuevo</Button></div>
                    {isEditing && <Card className="bg-white border-2 border-pink-100"><div className="grid grid-cols-2 gap-4 mb-6"><Input label="Sabor" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} /><Input label="Precio ($)" type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} /><Input label="Stock" type="number" value={form.stock} onChange={e=>setForm({...form,stock:e.target.value})} /><Input label="Emoji" value={form.emoji} onChange={e=>setForm({...form,emoji:e.target.value})} /><div className="col-span-2"><Input label="URL Foto" value={form.image} onChange={e=>setForm({...form,image:e.target.value})} /></div></div><div className="flex gap-2"><Button onClick={()=>{onAddProduct({...form,price:parseFloat(form.price),stock:parseInt(form.stock)});setIsEditing(false)}} className="flex-1">Guardar</Button><Button onClick={()=>setIsEditing(false)} variant="secondary" className="flex-1">Cancelar</Button></div></Card>}
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">{products.map(p => (
                        <div key={p.id} className="bg-white p-4 rounded-3xl border flex flex-col gap-4 group transition-all">
                            <div className="flex items-center gap-3"><div className="w-14 h-14 bg-gray-50 rounded-2xl flex items-center justify-center overflow-hidden">{p.image ? <img src={p.image} className="w-full h-full object-contain"/> : p.emoji}</div><div className="flex-1"><p className="font-bold text-gray-800">{p.name}</p><p className="text-xs font-bold text-pink-500">{p.stock} unid</p></div></div>
                            <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-all"><button onClick={()=>{setForm(p);setIsEditing(true)}} className="flex-1 py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold">Editar</button><button onClick={()=>onDeleteProduct(p.id)} className="p-2 text-red-500 bg-red-50 rounded-xl"><LucideIcon name="Trash2" size={16}/></button></div>
                        </div>
                    ))}</div>
                </div>
            );
        }

        function DashMaterials({ materials, onUpdateMaterial }) {
            const [selId, setSelId] = useState(null);
            const [q, setQ] = useState('');
            return (
                <div className="space-y-6 animate-fade-up text-left">
                    <h2 className="text-2xl font-bold">Insumos</h2>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="space-y-3">{materials.map(m => (<div key={m.id} className="bg-white p-4 rounded-3xl border flex justify-between items-center"><div><p className="font-bold">{m.name}</p><p className={`text-xs font-bold ${m.quantity < 2 ? 'text-red-500' : 'text-gray-400'}`}>{m.quantity} {m.unit}</p></div><Button onClick={()=>setSelId(m.id)} variant="secondary" className="py-1 px-4 text-xs">Usar</Button></div>))}</div>
                        {selId && <Card className="h-fit border-2 border-orange-100"><h3 className="font-bold mb-4 flex gap-2"><LucideIcon name="MinusCircle" className="text-orange-500"/> Registro de Uso</h3><div className="flex gap-2 mb-6"><input type="number" className="flex-1 p-4 rounded-2xl bg-gray-50 outline-none" value={q} onChange={e=>setQ(e.target.value)} placeholder="0.00" autoFocus /><span className="p-4 bg-gray-100 rounded-2xl font-bold">{materials.find(m=>m.id===selId)?.unit}</span></div><div className="flex gap-2"><Button onClick={()=>{onUpdateMaterial(selId, -parseFloat(q)); setSelId(null); setQ('')}} className="flex-1">Restar</Button><Button onClick={()=>setSelId(null)} variant="secondary">Cerrar</Button></div></Card>}
                    </div>
                </div>
            );
        }

        function DashExpenses({ materials, onAddTx, onUpdateMaterial }) {
            const [f, setF] = useState({ amount: '', desc: '', cat: 'Otros', isS: false, mId: '', mQ: '' });
            const save = () => {
                let d = f.desc; if(f.isS && f.mId) { const m = materials.find(x=>x.id===f.mId); d = `Compra: ${f.mQ}${m.unit} de ${m.name}`; onUpdateMaterial(f.mId, parseFloat(f.mQ)); }
                onAddTx({ type: 'expense', total: parseFloat(f.amount), description: d, category: f.cat });
                setF({ amount: '', desc: '', cat: 'Otros', isS: false, mId: '', mQ: '' }); alert("Gasto anotado");
            };
            return (
                <div className="max-w-xl mx-auto space-y-6 text-left">
                    <h2 className="text-2xl font-bold">Registrar Gasto</h2>

                        if(u) {
                            fb.onSnapshot(fb.collection(fb.db, 'artifacts', APP_ID, 'public', 'data', 'products'), s => setProducts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                            fb.onSnapshot(fb.collection(fb.db, 'artifacts', APP_ID, 'public', 'data', 'materials'), s => setMaterials(s.docs.map(d => ({id:d.id, ...d.data()}))));
                            fb.onSnapshot(fb.query(fb.collection(fb.db, 'artifacts', APP_ID, 'public', 'data', 'transactions'), fb.orderBy('date', 'desc')), s => setTransactions(s.docs.map(d => ({id:d.id, ...d.data()}))));
                            fb.onSnapshot(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'general'), s => { if(s.exists()) setSettings(s.data()); });
                            setTimeout(() => { setIsZooming(true); setTimeout(() => { setIsInitialLoading(false); }, 600); }, 1000);
                        }
                    });
                    fb.signInAnonymously(fb.auth).catch(console.error);
                };
                if(window.fb) init(); else window.addEventListener('firebase-ready', init);
            }, []);

            const fbOps = {
                onUpdateStock: async (id, d) => { const fb = window.fb; const p = products.find(x=>x.id===id); if(p) await fb.updateDoc(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'products', id), { stock: Math.max(0, p.stock + d) }); },
                onUpdateMaterial: async (id, d) => { const fb = window.fb; const m = materials.find(x=>x.id===id); if(m) await fb.updateDoc(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'materials', id), { quantity: Math.max(0, parseFloat((m.quantity + d).toFixed(2))) }); },
                onAddProduct: async (d) => { const fb = window.fb; await fb.addDoc(fb.collection(fb.db, 'artifacts', APP_ID, 'public', 'data', 'products'), d); },
                onEditProduct: async (id, d) => { const fb = window.fb; await fb.updateDoc(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'products', id), d); },
                onDeleteProduct: async (id) => { const fb = window.fb; if(confirm("¿Eliminar sabor?")) await fb.deleteDoc(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'products', id)); },
                onAddTx: async (d) => { const fb = window.fb; await fb.addDoc(fb.collection(fb.db, 'artifacts', APP_ID, 'public', 'data', 'transactions'), {...d, date: new Date().toISOString(), timestamp: fb.serverTimestamp()}); },
                onDeleteTx: async (id) => { const fb = window.fb; if(confirm("¿Eliminar registro?")) await fb.deleteDoc(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'transactions', id)); },
                onSaveSettings: async (d) => { const fb = window.fb; await fb.setDoc(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'general'), d); alert("Guardado"); },
                onResetDb: async () => {
                    const fb = window.fb; if(!confirm("⚠️ ¿Poner inventario en cero?")) return;
                    const batch = fb.writeBatch(fb.db);
                    products.forEach(p => batch.update(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'products', p.id), { stock: 0 }));
                    materials.forEach(m => batch.update(fb.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'materials', m.id), { quantity: 0 }));
                    await batch.commit();
                }
            };

            if (isInitialLoading) return (<div className="min-h-screen bg-white flex items-center justify-center overflow-hidden"><div className={`transition-all duration-300 ${isZooming ? 'animate-zoom-portal' : 'animate-pulse-logo'}`}><img src={LOGO_URL} className="w-48 h-48 object-contain filter drop-shadow-2xl" /></div></div>);
            if (showLogin) return <LoginScreen onLogin={(pin) => pin === settings.adminPin ? (setAppMode('admin'), setShowLogin(false), setLoginErr('')) : setLoginErr('PIN INCORRECTO')} onCancel={()=>setShowLogin(false)} error={loginErr} />;
            if (appMode === 'landing') return <LandingPage products={products} settings={settings} onSwitchToAdmin={()=>setShowLogin(true)} onUpdateStock={fbOps.onUpdateStock} onAddTx={fbOps.onAddTx} />;
            return <AdminDashboard products={products} rawMaterials={materials} transactions={transactions} settings={settings} onSwitchToLanding={()=>setAppMode('landing')} onStock={fbOps.onUpdateStock} {...fbOps} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
